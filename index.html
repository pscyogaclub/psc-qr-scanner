<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSC Attendance Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260820-09">
  <link rel="stylesheet" href="psc-ambience-v2.css?v=20260820-01">
</head>
<body>
  <main class="app">
    <section class="scanner-card">
      <header class="header">
        <!-- PSC Admin HOME: warm-up the Apps Script route before the visible navigation. -->
        <a
          class="psc-home"
          href="https://script.google.com/macros/s/AKfycbxQNDwNvycomkkkgQ588fz2bOJip5Wso6dXuuTfDqmtwXH8UYOUKPG1Umvm-SGORrtp/exec?page=admin"
          aria-label="Buka PSC Admin"
          onclick="event.preventDefault(); pscOpenAdmin();">
          <span class="home-icon">⌂</span> HOME
        </a>

        <img class="psc-logo" src="psc-logo-gold.png" alt="PSC Yoga Club">
        <div class="psc-tagline">PRESENT • STRETCH • CONNECT</div>
        <h1>QR ATTENDANCE</h1>
      </header>

      <section id="scannerSection">
        <div class="scanner-wrapper">
          <div id="reader"></div>
        </div>
      </section>

      <div id="statusBar">
        <span class="status-dot"></span>
        <span id="statusText">Initializing Camera...</span>
      </div>

      <div id="result"></div>
    </section>
  </main>

  <script>
    function pscOpenAdmin() {
      const base = 'https://script.google.com/macros/s/AKfycbxQNDwNvycomkkkgQ588fz2bOJip5Wso6dXuuTfDqmtwXH8UYOUKPG1Umvm-SGORrtp/exec';
      const warmUrl = base + '?page=admin&_psc_warm=' + Date.now();
      const finalUrl = base + '?page=admin&_psc_nav=' + Date.now();

      // First request warms the Apps Script deployment. This reproduces the
      // browser's successful second Enter/reload without changing the UI.
      const frame = document.createElement('iframe');
      frame.setAttribute('aria-hidden', 'true');
      frame.style.position = 'fixed';
      frame.style.width = '1px';
      frame.style.height = '1px';
      frame.style.opacity = '0';
      frame.style.pointerEvents = 'none';
      frame.style.border = '0';
      frame.src = warmUrl;
      document.body.appendChild(frame);

      setTimeout(function () {
        window.location.replace(finalUrl);
      }, 900);
    }
  </script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="app.js"></script>
</body>
</html>
