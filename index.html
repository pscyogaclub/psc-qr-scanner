<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PSC QR Attendance Scanner</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- Background Decoration -->
    <!-- ========================= -->

    <div class="bg-overlay"></div>
    <div class="bg-glow"></div>

    <!-- ========================= -->
    <!-- Main Container -->
    <!-- ========================= -->

    <main class="scanner-app">

        <!-- ========================= -->
        <!-- Header -->
        <!-- ========================= -->

        <header class="hero">

            <button
                class="admin-button"
                type="button">

                <span>⚙</span>

                ADMIN

            </button>

            <img
                src="psc-logo-gold.png"
                alt="PSC Yoga Club"
                class="psc-logo">

            <div class="brand">

                <h2>

                    PSC YOGA CLUB

                </h2>

                <p>

                    PRESENT • STRETCH • CONNECT

                </p>

            </div>

        </header>

        <!-- ========================= -->
        <!-- Title -->
        <!-- ========================= -->

        <section class="page-title">

            <h1>

                QR Attendance

            </h1>

            <p>

                Scan member QR Code for attendance

            </p>

        </section>

        <!-- ========================= -->
        <!-- Scanner -->
        <!-- ========================= -->

        <section
            id="scannerSection"
            class="scanner-panel">

            <div class="scanner-frame">

                <span class="corner top-left"></span>
                <span class="corner top-right"></span>
                <span class="corner bottom-left"></span>
                <span class="corner bottom-right"></span>

                <div
                    id="reader">

                </div>

                <div class="scanner-guide">

                    📷 Arahkan kamera ke QR Code member

                </div>

            </div>

        </section>

        <!-- ========================= -->
        <!-- Result -->
        <!-- ========================= -->

        <section
            id="resultCard"
            class="result-panel">

            <div class="result-header">

                <div class="success-icon">

                    ✓

                </div>

                <div>

                    <div class="result-label">

                        Attendance Recorded

                    </div>

                    <h2>

                        Check-in Success!

                    </h2>

                </div>

            </div>

            <div class="result-divider"></div>

            <div class="member-info">

                <div class="info-box">

                    <label>

                        Member ID

                    </label>

                    <strong id="memberId">

                        -

                    </strong>

                </div>

                <div class="info-box">

                    <label>

                        Membership ID

                    </label>

                    <strong id="membershipId">

                        -

                    </strong>

                </div>

                <div class="info-box">

                    <label>

                        Remaining Session

                    </label>

                    <strong id="remainingSessions">

                        -

                    </strong>

                </div>

                <div class="info-box">

                    <label>

                        Status

                    </label>

                    <span
                        id="statusBadge"
                        class="status-badge">

                        -

                    </span>

                </div>

            </div>

            <button
                id="scanAgainBtn"
                class="primary-button"
                type="button">

                Scan Member Berikutnya

            </button>

        </section>

        <!-- ========================= -->
        <!-- Footer -->
        <!-- ========================= -->

        <footer class="footer">

            <span>

                PSC Yoga Club

            </span>

            <span>

                •

            </span>

            <span>

                Admin Scanner v1.0

            </span>

        </footer>

    </main>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="app.js"></script>

</body>

</html>
