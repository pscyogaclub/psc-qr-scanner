<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PSC Attendance Scanner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">

        <div class="scanner-card">

            <!-- ===================== -->
            <!-- HEADER -->
            <!-- ===================== -->

            <div class="header">

                <div class="psc-logo">

                    <div class="logo-circle">
                        PSC
                    </div>

                </div>

                <h1>QR Attendance</h1>

                <p>
                    Present • Stretch • Connect
                </p>

            </div>

            <!-- ===================== -->
            <!-- CAMERA -->
            <!-- ===================== -->

            <div id="scannerSection">

                <div class="scanner-wrapper">

                    <div id="reader"></div>

                </div>

            </div>

            <!-- ===================== -->
            <!-- STATUS -->
            <!-- ===================== -->

            <div id="statusBar">

                <span class="status-dot"></span>

                <span id="statusText">

                    Initializing Camera...

                </span>

            </div>

            <!-- ===================== -->
            <!-- RESULT -->
            <!-- ===================== -->

            <div id="result">

                Waiting for QR Code...

            </div>

        </div>

    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="app.js"></script>

</body>

</html>
