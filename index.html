<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PSC Admin Scanner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background-glow"></div>

<div class="app">

    <div class="scanner-card">

        <!-- ============================= -->
        <!-- HEADER -->
        <!-- ============================= -->

        <header class="hero">

            <img
                src="psc-logo-gold.png"
                alt="PSC Yoga Club"
                class="logo">

            <h1>

                PSC YOGA CLUB

            </h1>

            <p class="subtitle">

                QR Attendance Scanner

            </p>

            <p class="tagline">

                Present • Stretch • Connect

            </p>

        </header>

        <!-- ============================= -->
        <!-- SCANNER -->
        <!-- ============================= -->

        <section
            id="scannerSection">

            <div class="scanner-frame">

                <div id="reader"></div>

            </div>

        </section>

        <!-- ============================= -->
        <!-- STATUS -->
        <!-- ============================= -->

        <section class="status-wrapper">

            <div id="statusBar">

                <span class="status-dot"></span>

                <span id="statusText">

                    Initializing Camera...

                </span>

            </div>

        </section>

        <!-- ============================= -->
        <!-- RESULT -->
        <!-- ============================= -->

        <section id="result">

            <div class="placeholder">

                Ready to Scan

            </div>

        </section>

    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="app.js"></script>

</body>

</html>
