<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PSC QR Attendance Scanner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background Decoration -->
    <div class="background-glow"></div>

    <div class="app">

        <main class="scanner-card">

            <!-- ================================= -->
            <!-- HERO -->
            <!-- ================================= -->

            <header class="hero">

                <img
                    src="psc-logo-gold.png"
                    alt="PSC Yoga Club"
                    class="logo">

                <div class="hero-divider"></div>

                <h1>

                    QR Attendance

                </h1>

                <p class="subtitle">

                    Scan member QR Code for attendance

                </p>

                <p class="tagline">

                    Present • Stretch • Connect

                </p>

            </header>

            <!-- ================================= -->
            <!-- SCANNER -->
            <!-- ================================= -->

            <section
                id="scannerSection"
                class="scanner-section">

                <div class="scanner-frame">

                    <div id="reader"></div>

                </div>

            </section>

            <!-- ================================= -->
            <!-- STATUS -->
            <!-- ================================= -->

            <section class="status-section">

                <div id="statusBar">

                    <span class="status-dot"></span>

                    <span id="statusText">

                        Initializing Camera...

                    </span>

                </div>

            </section>

            <!-- ================================= -->
            <!-- RESULT -->
            <!-- ================================= -->

            <section id="result">

                <div class="placeholder">

                    Ready to Scan

                </div>

            </section>

            <!-- ================================= -->
            <!-- FOOTER -->
            <!-- ================================= -->

            <footer class="footer">

                <span>

                    PSC Yoga Club

                </span>

                <span class="footer-divider">

                    •

                </span>

                <span>

                    Admin Scanner v1.0

                </span>

            </footer>

        </main>

    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="app.js"></script>

</body>

</html>
