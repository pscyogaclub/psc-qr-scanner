<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSC Attendance Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <section class="scanner-card">

      <!-- PSC HEADER -->
      <header class="header">
        <a
          class="psc-home"
          href="https://script.google.com/macros/s/AKfycbxQNDwNvycomkkkgQ588fz2bOJip5Wso6dXuuTfDqmtwXH8UYOUKPG1Umvm-SGORrtp/exec?page=admin"
          aria-label="Kembali ke PSC Admin">
          ⌂ HOME
        </a>

        <img
          class="psc-logo"
          src="psc-logo-gold.png"
          alt="PSC Yoga Club">

        <h1>QR Attendance</h1>
      </header>

      <!-- CAMERA / SCANNER ENGINE
           DO NOT CHANGE id="reader". app.js depends on it. -->
      <section id="scannerSection">
        <div class="scanner-wrapper">
          <div id="reader"></div>
        </div>
      </section>

      <!-- STATUS -->
      <div id="statusBar">
        <span class="status-dot"></span>
        <span id="statusText">Initializing Camera...</span>
      </div>

      <!-- RESULT
           app.js writes its check-in result here. -->
      <div id="result">
        Waiting for QR Code...
      </div>

    </section>
  </main>

  <!-- SCANNER ENGINE: UNCHANGED -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="app.js"></script>
</body>
</html>
