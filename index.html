<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PSC QR Attendance Scanner</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <!-- ===================================== -->
    <!-- HEADER -->
    <!-- ===================================== -->

    <header class="hero">

        <button
            class="admin-btn">

            ⚙ ADMIN

        </button>

        <img
            src="psc-logo-gold.png"
            alt="PSC Yoga Club"
            class="logo">

        <h3>

            PSC YOGA CLUB

        </h3>

        <p>

            PRESENT • STRETCH • CONNECT

        </p>

    </header>

    <!-- ===================================== -->
    <!-- TITLE -->
    <!-- ===================================== -->

    <section class="title">

        <h1>

            QR Attendance

        </h1>

        <p>

            Scan member QR Code for attendance

        </p>

    </section>

    <!-- ===================================== -->
    <!-- SCANNER -->
    <!-- ===================================== -->

    <section
        id="scannerSection"
        class="scanner-card">

        <div
            class="scanner-frame">

            <div
                class="corner tl"></div>

            <div
                class="corner tr"></div>

            <div
                class="corner bl"></div>

            <div
                class="corner br"></div>

            <div
                id="reader">

            </div>

            <div
                class="scanner-caption">

                📷 Arahkan kamera ke QR Code member

            </div>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- RESULT -->
    <!-- ===================================== -->

    <section
        id="resultCard"
        class="result-card">

        <div
            class="success-row">

            <div
                class="success-icon">

                ✓

            </div>

            <div>

                <div
                    class="success-small">

                    Attendance Recorded

                </div>

                <h2>

                    Check-in Success!

                </h2>

            </div>

        </div>

        <div
            class="divider">

        </div>

        <div
            class="member-grid">

            <div
                class="info">

                <label>

                    Member ID

                </label>

                <strong
                    id="memberId">

                    -

                </strong>

            </div>

            <div
                class="info">

                <label>

                    Membership ID

                </label>

                <strong
                    id="membershipId">

                    -

                </strong>

            </div>

            <div
                class="info">

                <label>

                    Remaining Session

                </label>

                <strong
                    id="remainingSessions">

                    -

                </strong>

            </div>

            <div
                class="info">

                <label>

                    Status

                </label>

                <span
                    id="statusBadge"
                    class="badge">

                    -

                </span>

            </div>

        </div>

        <button
            id="scanAgainBtn">

            Scan Member Berikutnya

        </button>

    </section>

    <!-- ===================================== -->
    <!-- FOOTER -->
    <!-- ===================================== -->

    <footer>

        PSC Yoga Club
        •

        Admin Scanner v1.0

    </footer>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="app.js"></script>

</body>

</html>
