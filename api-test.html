<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSC API Test</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    padding:40px;
    max-width:500px;
    margin:auto;
}
button{
    width:100%;
    padding:16px;
    font-size:18px;
}
pre{
    margin-top:20px;
    padding:16px;
    background:#f3f3f3;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>
</head>

<body>

<h2>PSC API Test</h2>

<button id="btn">Test API</button>

<pre id="result">Ready...</pre>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx6PT4GApnNfAEOGjWJin3INbMcV6a_owkCPC1FEmBl_A3LT2TRSGAqY8Nuk7NInYzC/exec";

const result = document.getElementById("result");

document.getElementById("btn").onclick = async () => {

    result.textContent = "Sending...";

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                membershipId: "PSC-001-01"
            })
        });

        const text = await response.text();

        result.textContent = text;

    } catch (err) {

        result.textContent = "FAILED\n\n" + err;

    }

};

</script>

</body>
</html>
